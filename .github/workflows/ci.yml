name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2.2.0
        with:
          version: 0.15.2

      - name: Build Zig library
        working-directory: fastjsondiff/_zig
        run: zig build

      - name: Copy library to package directory (Linux)
        if: runner.os == 'Linux'
        run: cp fastjsondiff/_zig/zig-out/lib/libfastjsondiff_core.so fastjsondiff/

      - name: Copy library to package directory (macOS)
        if: runner.os == 'macOS'
        run: cp fastjsondiff/_zig/zig-out/lib/libfastjsondiff_core.dylib fastjsondiff/

      - name: Copy library to package directory (Windows)
        if: runner.os == 'Windows'
        run: copy fastjsondiff\_zig\zig-out\bin\fastjsondiff_core.dll fastjsondiff\

      - name: Run Zig tests
        working-directory: fastjsondiff/_zig
        run: zig build test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: pip install -e ".[test]"

      - name: Run pytest
        run: pytest

  build_wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2.2.0
        with:
          version: 0.15.2

      - name: Build Zig library
        working-directory: fastjsondiff/_zig
        run: zig build -Doptimize=ReleaseFast

      - name: Copy library to package directory (Linux)
        if: runner.os == 'Linux'
        run: cp fastjsondiff/_zig/zig-out/lib/libfastjsondiff_core.so fastjsondiff/

      - name: Copy library to package directory (macOS)
        if: runner.os == 'macOS'
        run: cp fastjsondiff/_zig/zig-out/lib/libfastjsondiff_core.dylib fastjsondiff/

      - name: Copy library to package directory (Windows)
        if: runner.os == 'Windows'
        run: copy fastjsondiff\_zig\zig-out\bin\fastjsondiff_core.dll fastjsondiff\

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: pipx run build --wheel

      - name: Retag wheel with platform tag (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install wheel
          wheel tags --platform-tag=manylinux_2_17_x86_64 dist/*.whl --remove

      - name: Retag wheel with platform tag (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install wheel
          wheel tags --platform-tag=macosx_11_0_arm64 dist/*.whl --remove

      - name: Retag wheel with platform tag (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install wheel
          $whl = Get-ChildItem dist/*.whl | Select-Object -First 1
          wheel tags --platform-tag=win_amd64 $whl.FullName --remove

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2.2.0
        with:
          version: 0.15.2

      - name: Build Zig library
        working-directory: fastjsondiff/_zig
        run: zig build -Doptimize=ReleaseFast

      - name: Copy library to package directory
        run: cp fastjsondiff/_zig/zig-out/lib/libfastjsondiff_core.so fastjsondiff/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [test, build_wheels, build_sdist]
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-')
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [test, build_wheels, build_sdist]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fastjsondiff-zig
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
